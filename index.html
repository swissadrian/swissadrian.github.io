<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denkfunke</title>
<meta name="description" content="Denkfunke – Die tägliche Denkchallenge. Kostenloses Rätselspiel für Android.">
<style>
  :root { --bg:#FBF6EE; --card:#FFFFFF; --ink:#2B2622; --muted:#5E564F; --accent:#1E6E68; --line:#E6DED3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1916; --card:#26231F; --ink:#F2ECE4; --muted:#CFC6BB; --accent:#8ED3CB; --line:#3A352F; } }
  body { margin:0; background:var(--bg); color:var(--ink); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding: 28px 22px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  a { color: var(--accent); }
  .spark { color:#F5B83D; font-size: 2rem; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
<div class="card">
  <div class="spark">✦</div>
  <h1>Denkfunke</h1>
  <p class="muted">Die tägliche Denkchallenge</p>
  <p>Jeden Tag fünf kurze Rätsel – Zahlen, Logik und Wörter. Kostenlos, ohne Konto, ohne Zeitdruck. Für Android.</p>
  <p><a href="denkfunke/datenschutz/">Datenschutzerklärung</a></p>
  <p class="muted">Kontakt: <a href="mailto:swissad93@gmail.com">swissad93@gmail.com</a><br>Adrian Gasser, 4208 Nunningen, Schweiz</p>
</div>
</main>
</body>
</html>
